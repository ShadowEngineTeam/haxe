# TODO: support skip ci (https://github.community/t/github-actions-does-not-respect-skip-ci/17325/8)

name: CI
on: [push, pull_request]

jobs:
  windows64-build:
    # Built under MSYS2 (UCRT64) to unify the Windows jobs on MSYS2.
    # OCaml and the C dependencies come from MSYS2 packages; opam (which
    # MSYS2 does not package) is fetched from its official Windows release
    # and used only to install the OCaml libraries against the system
    # (MSYS2) OCaml. EXPERIMENTAL: replaces the previous Cygwin/setup-ocaml
    # recipe and needs CI verification. Installer/choco packaging is skipped
    # for now because Makefile.win's packaging relies on Cygwin's cygcheck.
    runs-on: windows-latest
    env:
      PLATFORM: windows64
      ARCH: 64
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make patch diffutils tar curl unzip rsync
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ocaml
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-mbedtls
            mingw-w64-ucrt-x86_64-zlib

      - name: Install Neko (win64)
        shell: msys2 {0}
        run: |
          set -ex
          curl -sSL https://github.com/ShadowEngineTeam/neko/releases/download/v2-4-1/neko-2.4.1-win64.zip -o /tmp/neko.zip
          mkdir -p /tmp/neko && unzip -q /tmp/neko.zip -d /tmp/neko
          NEKOPATH=$(echo /tmp/neko/neko-*-*)
          echo "NEKOPATH=$NEKOPATH" >> $GITHUB_ENV
          "$NEKOPATH/neko" -version 2>&1 || true

      - name: Install opam (official Windows binary)
        shell: msys2 {0}
        run: |
          set -ex
          curl -fsSL -o /usr/bin/opam.exe \
            https://github.com/ocaml/opam/releases/download/2.3.0/opam-2.3.0-x86_64-windows.exe
          opam --version

      - name: Set ADD_REVISION=1 for non-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: msys2 {0}
        run: echo "ADD_REVISION=1" >> $GITHUB_ENV

      - name: Build Haxe
        shell: msys2 {0}
        run: |
          set -ex
          export PATH="$NEKOPATH:$PATH"
          # Apply to every opam call: depext prompts appear in switch create
          # and install too, and plain --yes does not answer them.
          export OPAMCONFIRMLEVEL=unsafe-yes
          export OPAMYES=1
          git config --global --add safe.directory "$PWD"
          # Point opam at the MSYS2 already in PATH instead of letting it
          # download and manage its own internal Cygwin (opam's default),
          # which cannot run MSYS2's ocaml (fails with "Unbound module Stdlib").
          # Use the MSYS2 OCaml (ocaml-system); opam only builds the libraries.
          opam init --bare --disable-sandboxing --cygwin-location="$(cygpath -w /)"
          opam switch create . ocaml-system --no-install
          eval $(opam env)
          opam install haxe --deps-only --assume-depexts
          opam list
          opam exec -- make -s -f Makefile.win -j"$(nproc)" haxe
          opam exec -- make -s -f Makefile.win haxelib
          ./haxe.exe -version
          ldd ./haxe.exe || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win${{env.ARCH}}Binaries
          path: |
            haxe.exe
            haxelib.exe
            std

  windows-build:
    runs-on: windows-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      PLATFORM: windows
      ARCH: 32
      MINGW_ARCH: i686
      CYG_ROOT: D:\cygwin
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Use GNU Tar from msys
        run: |
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rm C:\msys64\usr\bin\bash.exe

      @import install-nsis.yml
      @import install-neko-windows.yml
      @import install-ocaml-windows.yml
      @import install-ocaml-libs-windows.yml
      @import build-windows.yml

  linux-build:
    runs-on: ubuntu-20.04
    env:
      PLATFORM: linux64
      OPAMYES: 1
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["4.08.1", "5.0.0"]
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Cache opam
        id: cache-opam
        uses: actions/cache@v4
        with:
          path: ~/.opam/
          key: ${{ runner.os }}-${{ matrix.ocaml }}-${{ hashFiles('./haxe.opam', './libs/') }}

      @import install-neko-unix.yml

      - name: Install dependencies
        run: |
          set -ex
          sudo add-apt-repository ppa:avsm/ppa -y # provides OPAM 2
          sudo add-apt-repository ppa:haxe/ocaml -y # provides newer version of mbedtls
          sudo apt-get update -qqy
          sudo apt-get install -qqy ocaml-nox camlp5 opam libpcre2-dev zlib1g-dev libgtk2.0-dev libmbedtls-dev ninja-build libstring-shellquote-perl libipc-system-simple-perl

      - name: Install OCaml libraries
        if: steps.cache-opam.outputs.cache-hit != 'true'
        run: |
          set -ex
          opam init # --disable-sandboxing
          opam update
          opam switch create ${{ matrix.ocaml }}
          opam pin add haxe . --no-action
          opam install haxe --deps-only --assume-depexts
          opam list
          ocamlopt -v

      - name: Set ADD_REVISION=1 for non-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "ADD_REVISION=1" >> $GITHUB_ENV

      - name: Build Haxe
        run: |
          set -ex
          eval $(opam env)
          opam config exec -- make -s -j`nproc` STATICLINK=1 haxe
          opam config exec -- make -s haxelib
          make -s package_unix
          ls -l out
          ldd -v ./haxe
          ldd -v ./haxelib

      # https://stackoverflow.com/questions/58033366/how-to-get-current-branch-within-github-actions
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Build xmldoc
        if: matrix.ocaml == '4.08.1'
        run: |
          set -ex
          make -s xmldoc
          cat >extra/doc/info.json <<EOL
            {
              "commit": "$GITHUB_SHA",
              "branch": "${{ steps.extract_branch.outputs.branch }}"
            }
          EOL

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBinaries${{ (matrix.ocaml == '5.0.0' && '_ocaml5') || '' }}
          path: out

      - name: Upload xmldoc artifact
        uses: actions/upload-artifact@v4
        if: matrix.ocaml == '4.08.1'
        with:
          name: xmldoc
          path: extra/doc

  linux-test:
    needs: linux-build
    runs-on: ubuntu-20.04
    env:
      PLATFORM: linux64
      TEST: ${{matrix.target}}
      HXCPP_COMPILE_CACHE: ~/hxcache
      HAXE_STD_PATH: /usr/local/share/haxe/std
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["4.08.1", "5.0.0"]
        target: [macro, js, hl, cpp, 'java,jvm', cs, php, python, lua, flash, neko]
        include:
          - target: hl
            APT_PACKAGES: cmake ninja-build libturbojpeg-dev
          - target: cpp
            APT_PACKAGES: gcc-multilib g++-multilib
          - target: lua
            APT_PACKAGES: ncurses-dev
          - target: flash
            APT_PACKAGES: libglib2.0-0 libgtk2.0-0 libfreetype6 xvfb
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: linuxBinaries${{ (matrix.ocaml == '5.0.0' && '_ocaml5') || '' }}
          path: linuxBinaries

      @import install-neko-unix.yml

      - name: Setup Haxe
        run: |
          sudo apt install -qqy libmbedtls-dev

          set -ex
          tar -xf linuxBinaries/*_bin.tar.gz -C linuxBinaries --strip-components=1
          sudo mkdir -p /usr/local/bin/
          sudo mkdir -p /usr/local/share/haxe/
          sudo ln -s `pwd`/linuxBinaries/haxe /usr/local/bin/haxe
          sudo ln -s `pwd`/linuxBinaries/haxelib /usr/local/bin/haxelib
          sudo ln -s `pwd`/linuxBinaries/std /usr/local/share/haxe/std

      - name: Print Haxe version
        run: haxe -version

      - name: Setup haxelib
        run: |
          set -ex
          mkdir ~/haxelib
          haxelib setup ~/haxelib

      - name: Install apt packages
        if: matrix.APT_PACKAGES
        run: |
          set -ex
          sudo apt update -qqy
          sudo apt install -qqy ${{matrix.APT_PACKAGES}}

      - name: Flash setup
        if: matrix.target == 'flash'
        run: export DISPLAY=:99.0

      - name: Test
        run: haxe RunCi.hxml
        working-directory: ${{github.workspace}}/tests

  test-docgen:
    needs: linux-build
    runs-on: ubuntu-20.04
    env:
      PLATFORM: linux64
      HXCPP_COMPILE_CACHE: ~/hxcache
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: linuxBinaries
          path: linuxBinaries

      - name: Download xmldoc artifact
        uses: actions/download-artifact@v4
        with:
          name: xmldoc
          path: xmldoc

      @import install-neko-unix.yml

      - name: Setup Haxe
        run: |
          sudo apt install -qqy libmbedtls-dev

          set -ex
          tar -xf linuxBinaries/*_bin.tar.gz -C linuxBinaries --strip-components=1
          sudo mkdir -p /usr/local/bin/
          sudo mkdir -p /usr/local/share/haxe/
          sudo ln -s `pwd`/linuxBinaries/haxe /usr/local/bin/haxe
          sudo ln -s `pwd`/linuxBinaries/haxelib /usr/local/bin/haxelib
          sudo ln -s `pwd`/linuxBinaries/std /usr/local/share/haxe/std

      - name: Print Haxe version
        run: haxe -version

      - name: Setup haxelib
        run: |
          set -ex
          mkdir ~/haxelib
          haxelib setup ~/haxelib

      - name: Test documentation generation
        run: |
          set -ex
          haxelib git dox https://github.com/HaxeFoundation/dox.git
          haxelib git hxtemplo https://github.com/Simn/hxtemplo.git
          haxelib git hxargs https://github.com/Simn/hxargs.git
          haxelib git markdown https://github.com/dpeek/haxe-markdown.git
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp.git
          cd $(haxelib libpath hxcpp)/tools/hxcpp
          haxe compile.hxml
          cd -
          haxe dox.hxml
          mkdir resources
          cp ../../src-json/* resources
          cpp/Dox -i ../../xmldoc -ex microsoft -ex javax -ex cs.internal -theme $(haxelib libpath dox)/themes/default
        working-directory: ${{github.workspace}}/tests/docgen

  linux-arm64-build:
    runs-on: ubuntu-22.04-arm
    env:
      PLATFORM: linux-arm64
      OPAMYES: 1
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Cache opam
        id: cache-opam
        uses: actions/cache@v4
        with:
          path: ~/.opam/
          key: arm-${{ runner.os }}-${{ hashFiles('./haxe.opam', './libs/') }}

      @import install-neko-unix.yml

      - name: Install dependencies
        run: |
          set -ex
          sudo apt-get update -qqy
          sudo apt-get install -qqy ocaml-nox opam libpcre2-dev zlib1g-dev libgtk2.0-dev libmbedtls-dev libipc-system-simple-perl libstring-shellquote-perl ninja-build

      - name: Install OCaml libraries
        if: steps.cache-opam.outputs.cache-hit != 'true'
        run: |
          set -ex
          opam init
          opam pin add haxe . --no-action
          opam install haxe --deps-only --assume-depexts
          opam list
          ocamlopt -v

      - name: Set ADD_REVISION=1 for non-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "ADD_REVISION=1" >> $GITHUB_ENV

      - name: Build Haxe
        run: |
          set -ex
          eval $(opam env)
          opam config exec -- make -s -j`nproc` STATICLINK=1 haxe
          opam config exec -- make -s haxelib
          make -s package_unix
          ls -l out
          ldd -v ./haxe
          ldd -v ./haxelib

      # https://stackoverflow.com/questions/58033366/how-to-get-current-branch-within-github-actions
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxArm64Binaries
          path: out

  linux-arm64-test:
    needs: linux-arm64-build
    runs-on: ubuntu-22.04-arm
    env:
      PLATFORM: linux-arm64
      TEST: ${{matrix.target}}
      HXCPP_COMPILE_CACHE: ~/hxcache
      HAXE_STD_PATH: /usr/local/share/haxe/std
    strategy:
      fail-fast: false
      matrix:
        target: [macro, js, cpp, jvm, php, python, lua, neko]
        include:
          - target: lua
            APT_PACKAGES: ncurses-dev
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: linuxArm64Binaries
          path: linuxBinaries

      @import install-neko-unix.yml

      - name: Setup Haxe
        run: |
          sudo apt install -qqy libmbedtls-dev

          set -ex
          tar -xf linuxBinaries/*_bin.tar.gz -C linuxBinaries --strip-components=1
          sudo mkdir -p /usr/local/bin/
          sudo mkdir -p /usr/local/share/haxe/
          sudo ln -s `pwd`/linuxBinaries/haxe /usr/local/bin/haxe
          sudo ln -s `pwd`/linuxBinaries/haxelib /usr/local/bin/haxelib
          sudo ln -s `pwd`/linuxBinaries/std /usr/local/share/haxe/std

      - name: Print Haxe version
        run: haxe -version

      - name: Setup haxelib
        run: |
          set -ex
          mkdir ~/haxelib
          haxelib setup ~/haxelib

      - name: Install apt packages
        if: matrix.APT_PACKAGES
        run: |
          set -ex
          sudo apt update -qqy
          sudo apt install -qqy ${{matrix.APT_PACKAGES}}

      - name: Test
        run: haxe RunCi.hxml
        working-directory: ${{github.workspace}}/tests

  linux-armv7-build:
    runs-on: ubuntu-22.04-arm
    env:
      PLATFORM: linux-armv7
      OPAMYES: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Set ADD_REVISION=1 for non-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "ADD_REVISION=1" >> $GITHUB_ENV

      # There is no GitHub-hosted armv7 runner. Build inside an armhf Debian
      # root created with debootstrap and entered via chroot + linux32, the
      # same approach used by the Neko CI. On the arm64 runner the armhf
      # binaries run natively; qemu-user-static provides the binfmt handler
      # as a fallback.
      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
          df -h /

      - name: Set up armhf build root
        run: |
          set -ex
          sudo apt-get update -qqy
          sudo apt-get install -qqy qemu-user-static binfmt-support debootstrap
          sudo debootstrap --arch=armhf --variant=buildd \
            bookworm rootfs http://deb.debian.org/debian
          # ocaml-nox provides the distro OCaml compiler so opam can use
          # ocaml-system instead of compiling a compiler from source.
          sudo chroot rootfs env DEBIAN_FRONTEND=noninteractive apt-get install -qqy \
            build-essential make patch unzip git ca-certificates curl \
            opam m4 cmake ninja-build pkg-config ocaml-nox rsync \
            libpcre2-dev zlib1g-dev libmbedtls-dev
          sudo chroot rootfs apt-get clean

      - name: Build Haxe
        run: |
          set -ex
          sudo mkdir -p rootfs/haxe
          sudo mount --bind "$PWD" rootfs/haxe
          sudo chroot rootfs linux32 env \
            ADD_REVISION="${ADD_REVISION:-}" OPAMYES=1 PLATFORM=linux-armv7 \
            bash -ex -c '
              cd /haxe
              git config --global --add safe.directory /haxe

              # Install Neko from GitHub releases
              curl -sSL https://github.com/ShadowEngineTeam/neko/releases/download/v2-4-1/neko-2.4.1-linux-armv7.tar.gz -o /tmp/neko_latest.tar.gz
              tar -xf /tmp/neko_latest.tar.gz -C /tmp
              NEKOPATH=$(echo /tmp/neko-*-*)
              mkdir -p /usr/local/bin /usr/local/include /usr/local/lib/neko
              ln -s $NEKOPATH/{neko,nekoc,nekoml,nekotools} /usr/local/bin/
              ln -s $NEKOPATH/libneko.* /usr/local/lib/
              ln -s $NEKOPATH/include/* /usr/local/include/
              ln -s $NEKOPATH/*.ndll /usr/local/lib/neko/
              ldconfig
              neko -version

              # Use the distro OCaml (ocaml-system) so opam does not build a
              # compiler from source (which exhausted the runner disk).
              opam init --bare --disable-sandboxing --yes
              opam switch create system ocaml-system --yes
              eval $(opam env --switch=system)
              # Install deps only. Pin a throwaway dir with just the opam
              # file so opam does not rsync the whole working tree (.git etc.)
              # over the bind mount; opam uses rsync for path pins (installed
              # in the root above).
              mkdir -p /tmp/haxepin
              cp haxe.opam /tmp/haxepin/
              opam pin add haxe /tmp/haxepin --no-action --yes --kind path
              opam install haxe --deps-only --assume-depexts --yes
              opam list
              opam config exec -- make -s -j$(nproc) STATICLINK=1 haxe
              opam config exec -- make -s haxelib
              make -s package_unix
              ls -l out
              ldd -v ./haxe
              ldd -v ./haxelib
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxArmv7Binaries
          path: out

  linux32-build:
    runs-on: ubuntu-22.04
    env:
      PLATFORM: linux32
      OPAMYES: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Set ADD_REVISION=1 for non-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "ADD_REVISION=1" >> $GITHUB_ENV

      # GitHub has no 32-bit x86 runner. Build inside an i386 Debian root
      # created with debootstrap and entered via chroot + linux32, the same
      # approach used by the Neko CI. x86_64 CPUs run i386 code natively, so
      # no emulation is needed.
      - name: Set up i386 build root
        run: |
          set -ex
          sudo apt-get update -qqy
          sudo apt-get install -qqy debootstrap
          sudo debootstrap --arch=i386 --variant=buildd \
            bookworm rootfs http://deb.debian.org/debian
          # ocaml-nox provides the distro OCaml compiler so opam can use
          # ocaml-system instead of compiling a compiler from source.
          sudo chroot rootfs env DEBIAN_FRONTEND=noninteractive apt-get install -qqy \
            build-essential make patch unzip git ca-certificates curl \
            opam m4 cmake ninja-build pkg-config ocaml-nox rsync \
            libpcre2-dev zlib1g-dev libmbedtls-dev
          sudo chroot rootfs apt-get clean

      - name: Build Haxe
        run: |
          set -ex
          sudo mkdir -p rootfs/haxe
          sudo mount --bind "$PWD" rootfs/haxe
          sudo chroot rootfs linux32 env \
            ADD_REVISION="${ADD_REVISION:-}" OPAMYES=1 PLATFORM=linux32 \
            bash -ex -c '
              cd /haxe
              git config --global --add safe.directory /haxe

              # Install Neko from GitHub releases
              curl -sSL https://github.com/ShadowEngineTeam/neko/releases/download/v2-4-1/neko-2.4.1-linux.tar.gz -o /tmp/neko_latest.tar.gz
              tar -xf /tmp/neko_latest.tar.gz -C /tmp
              NEKOPATH=$(echo /tmp/neko-*-*)
              mkdir -p /usr/local/bin /usr/local/include /usr/local/lib/neko
              ln -s $NEKOPATH/{neko,nekoc,nekoml,nekotools} /usr/local/bin/
              ln -s $NEKOPATH/libneko.* /usr/local/lib/
              ln -s $NEKOPATH/include/* /usr/local/include/
              ln -s $NEKOPATH/*.ndll /usr/local/lib/neko/
              ldconfig
              neko -version

              # Use the distro OCaml (ocaml-system) so opam does not build a
              # compiler from source.
              opam init --bare --disable-sandboxing --yes
              opam switch create system ocaml-system --yes
              eval $(opam env --switch=system)
              # Install deps only. Pin a throwaway dir with just the opam
              # file so opam does not rsync the whole working tree (.git etc.)
              # over the bind mount; opam uses rsync for path pins (installed
              # in the root above).
              mkdir -p /tmp/haxepin
              cp haxe.opam /tmp/haxepin/
              opam pin add haxe /tmp/haxepin --no-action --yes --kind path
              opam install haxe --deps-only --assume-depexts --yes
              opam list
              opam config exec -- make -s -j$(nproc) STATICLINK=1 haxe
              opam config exec -- make -s haxelib
              make -s package_unix
              ls -l out
              ldd -v ./haxe
              ldd -v ./haxelib
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux32Binaries
          path: out

  windows-arm64-build:
    # EXPERIMENTAL SPIKE (expected to fail): try to build OCaml from source
    # for native aarch64-Windows using MSYS2 / CLANGARM64. Mainline OCaml has
    # no supported aarch64-Windows target and there is no usable fork, so no
    # OCaml compiler targets this platform yet. This job attempts a
    # bytecode-only build (bytecode needs no target codegen, so it has the
    # best odds) to find out how far a from-source build gets and where it
    # breaks. It is not part of the release artifacts until it yields a
    # working compiler; subsequent steps (opam, deps, Haxe) come after.
    runs-on: windows-11-arm
    env:
      PLATFORM: windows-arm64
      ARCH: arm64
      OCAML_SRC_VERSION: "5.3.0"
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Set up MSYS2 (CLANGARM64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make patch diffutils tar curl
            mingw-w64-clang-aarch64-toolchain

      - name: Try to build OCaml from source (bytecode-first)
        shell: msys2 {0}
        run: |
          set -ex
          ver="$OCAML_SRC_VERSION"
          curl -LO "https://github.com/ocaml/ocaml/archive/refs/tags/${ver}.tar.gz"
          tar xf "${ver}.tar.gz"
          cd "ocaml-${ver}"
          # Mainline has no aarch64-Windows native backend, so attempt a
          # bytecode-only build (no target-specific codegen needed).
          ./configure --disable-native-compiler --prefix=/clangarm64 CC=clang
          make -j"$(nproc)"
          make install
          ocamlc -config
          ocamlc -version

      # TODO(next): if the bytecode OCaml builds, build opam from source, then
      # build Haxe's OCaml deps and Haxe itself (as bytecode) with the
      # CLANGARM64 C toolchain + the win-arm64 Neko.

  mac-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    env:
      PLATFORM: mac${{ matrix.os == 'macos-14' && '-arm64' || '' }}
      OPAMYES: 1
      MACOSX_DEPLOYMENT_TARGET: 10.13
      OCAML_VERSION: 5.1.1
      CTYPES: 0.21.1
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Cache opam
        id: cache-opam
        uses: actions/cache@v4
        with:
          path: ~/.opam/
          key: ${{ matrix.os }}-${{ hashFiles('./haxe.opam', './libs/') }}

      @import install-neko-unix.yml
      @import build-mac.yml

  windows64-test:
    needs: windows64-build
    runs-on: windows-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      PLATFORM: windows64
      TEST: ${{matrix.target}}
      HXCPP_COMPILE_CACHE: ~/hxcache
      ARCH: 64
    strategy:
      fail-fast: false
      matrix:
        # TODO enable lua after https://github.com/HaxeFoundation/haxe/issues/10919
        target: [macro, js, hl, cpp, 'java,jvm', cs, php, python, flash, neko]
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: win${{env.ARCH}}Binaries
          path: win${{env.ARCH}}Binaries

      @import install-neko-windows.yml
      @import test-windows.yml

  windows-test:
    needs: windows-build
    runs-on: windows-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      PLATFORM: windows
      TEST: ${{matrix.target}}
      HXCPP_COMPILE_CACHE: ~/hxcache
      ARCH: 32
    strategy:
      fail-fast: false
      matrix:
        # TODO jvm: https://github.com/HaxeFoundation/haxe/issues/8601
        # TODO enable lua after https://github.com/HaxeFoundation/haxe/issues/10919
        target: [macro, js, hl, cpp, java, cs, php, python, flash, neko]
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: win${{env.ARCH}}Binaries
          path: win${{env.ARCH}}Binaries

      @import install-neko-windows.yml
      @import test-windows.yml

  mac-build-universal:
    needs: mac-build
    runs-on: macos-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@main
      - uses: actions/download-artifact@v4
        with:
          name: macX64Binaries
          path: macX64Binaries
      - uses: actions/download-artifact@v4
        with:
          name: macArmBinaries
          path: macArmBinaries

      - name: Make universal binary
        run: |
          set -ex
          tar -xf macX64Binaries/*_bin.tar.gz -C macX64Binaries --strip-components=1
          tar -xf macArmBinaries/*_bin.tar.gz -C macArmBinaries --strip-components=1
          lipo -create -output haxe macX64Binaries/haxe macArmBinaries/haxe
          lipo -create -output haxelib macX64Binaries/haxelib macArmBinaries/haxelib
          make -s package_unix package_installer_mac PACKAGE_INSTALLER_MAC_ARCH=universal
          ls -l out
          otool -L ./haxe
          otool -L ./haxelib

      - name: Upload artifact (universal)
        uses: actions/upload-artifact@v4
        with:
          name: macBinaries
          path: out

  mac-test:
    needs: mac-build-universal
    runs-on: macos-13
    env:
      PLATFORM: mac
      TEST: ${{matrix.target}}
      HXCPP_COMPILE_CACHE: ~/hxcache
      HAXE_STD_PATH: /usr/local/share/haxe/std
    strategy:
      fail-fast: false
      matrix:
        target: [macro, js, hl, cpp, 'java,jvm', cs, php, python, flash, neko]
        include:
          - target: hl
            BREW_PACKAGES: ninja
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: macBinaries
          path: macBinaries

      @import install-neko-unix.yml
      @import test-mac.yml

  deploy:
    if: success() && github.repository_owner == 'HaxeFoundation' && github.event_name != 'pull_request'
    needs: [linux-test, linux-arm64-test, mac-test, windows-test, windows64-test]
    runs-on: ubuntu-20.04
    steps:
      # this is only needed for to get `COMMIT_DATE`...
      # maybe https://github.community/t/expose-commit-timestamp-in-the-github-context-data/16460/3
      # would be faster
      - name: Checkout the repository
        uses: actions/checkout@main

      - name: Download build artifacts
        uses: actions/download-artifact@v4

      - name: Install awscli
        run: |
          set -ex
          sudo apt-get update -qqy
          sudo apt-get install -qqy awscli

      # https://stackoverflow.com/questions/58033366/how-to-get-current-branch-within-github-actions
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Upload binaries
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HXBUILDS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HXBUILDS_AWS_SECRET_ACCESS_KEY }}
          HXBUILDS_S3ADDR: ${{ secrets.HXBUILDS_S3ADDR }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          set -ex
          COMMIT_HASH_SHORT=${GITHUB_SHA:0:7}
          COMMIT_DATE=`TZ=UTC git show --quiet --date='format-local:%Y-%m-%d' --format="%cd"`
          FILE_NAME=haxe_${COMMIT_DATE}_${{ steps.extract_branch.outputs.branch }}_${COMMIT_HASH_SHORT}
          aws s3 cp linuxBinaries/*_bin.tar.gz      ${HXBUILDS_S3ADDR}/haxe/linux64/${FILE_NAME}.tar.gz
          aws s3 cp linuxArm64Binaries/*_bin.tar.gz ${HXBUILDS_S3ADDR}/haxe/linux-arm64/${FILE_NAME}.tar.gz
          aws s3 cp macBinaries/*_bin.tar.gz        ${HXBUILDS_S3ADDR}/haxe/mac/${FILE_NAME}.tar.gz
          aws s3 cp macBinaries/*_installer.tar.gz  ${HXBUILDS_S3ADDR}/haxe/mac-installer/${FILE_NAME}.tar.gz
          aws s3 cp win64Binaries/*_bin.zip         ${HXBUILDS_S3ADDR}/haxe/windows64/${FILE_NAME}.zip
          aws s3 cp win64Binaries/*_installer.zip   ${HXBUILDS_S3ADDR}/haxe/windows64-installer/${FILE_NAME}.zip
          aws s3 cp win64Binaries/*.nupkg           ${HXBUILDS_S3ADDR}/haxe/windows64-choco/
          aws s3 cp win32Binaries/*_bin.zip         ${HXBUILDS_S3ADDR}/haxe/windows/${FILE_NAME}.zip
          aws s3 cp win32Binaries/*_installer.zip   ${HXBUILDS_S3ADDR}/haxe/windows-installer/${FILE_NAME}.zip
          aws s3 cp win32Binaries/*.nupkg           ${HXBUILDS_S3ADDR}/haxe/windows-choco/

      - name: Update "latest"
        if: github.ref == 'refs/heads/development'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HXBUILDS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HXBUILDS_AWS_SECRET_ACCESS_KEY }}
          HXBUILDS_S3ADDR: ${{ secrets.HXBUILDS_S3ADDR }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          set -ex
          aws s3 cp linuxBinaries/*_bin.tar.gz      ${HXBUILDS_S3ADDR}/haxe/linux64/haxe_latest.tar.gz
          aws s3 cp linuxArm64Binaries/*_bin.tar.gz ${HXBUILDS_S3ADDR}/haxe/linux-arm64/haxe_latest.tar.gz
          aws s3 cp macBinaries/*_bin.tar.gz        ${HXBUILDS_S3ADDR}/haxe/mac/haxe_latest.tar.gz
          aws s3 cp macBinaries/*_installer.tar.gz  ${HXBUILDS_S3ADDR}/haxe/mac-installer/haxe_latest.tar.gz
          aws s3 cp win64Binaries/*_bin.zip         ${HXBUILDS_S3ADDR}/haxe/windows64/haxe_latest.zip
          aws s3 cp win64Binaries/*_installer.zip   ${HXBUILDS_S3ADDR}/haxe/windows64-installer/haxe_latest.zip
          aws s3 cp win32Binaries/*_bin.zip         ${HXBUILDS_S3ADDR}/haxe/windows/haxe_latest.zip
          aws s3 cp win32Binaries/*_installer.zip   ${HXBUILDS_S3ADDR}/haxe/windows-installer/haxe_latest.zip

          # Chocolatey packages have to be named with version number,
          # so let's use web redirection to keep the original file name.
          [[ "$HXBUILDS_S3ADDR" =~ s3://([^/]+)(.*) ]] && HXBUILDS_S3BUCKET="${BASH_REMATCH[1]}" && HXBUILDS_S3PATH="${BASH_REMATCH[2]}"
          [[ `echo win64Binaries/*.nupkg` =~ win64Binaries/(.+) ]] && FILE_NAME="${BASH_REMATCH[1]}"
          aws s3 cp ${HXBUILDS_S3ADDR}/haxe/windows64-choco/${FILE_NAME} ${HXBUILDS_S3ADDR}/haxe/windows64-choco/haxe_latest.nupkg --acl public-read --website-redirect "${HXBUILDS_S3PATH}/haxe/windows64-choco/${FILE_NAME}"
          [[ `echo win32Binaries/*.nupkg` =~ win32Binaries/(.+) ]] && FILE_NAME="${BASH_REMATCH[1]}"
          aws s3 cp ${HXBUILDS_S3ADDR}/haxe/windows-choco/${FILE_NAME}   ${HXBUILDS_S3ADDR}/haxe/windows-choco/haxe_latest.nupkg   --acl public-read --website-redirect "${HXBUILDS_S3PATH}/haxe/windows-choco/${FILE_NAME}"

  deploy_apidoc:
    if: success() && github.repository_owner == 'HaxeFoundation' && github.event_name != 'pull_request'
    needs: [linux-test, linux-arm64-test, mac-test, windows-test, windows64-test]
    runs-on: ubuntu-20.04
    steps:
      - name: Install dependencies
        run: |
          set -ex
          sudo apt-get install -qqy libc6

      - name: Download Haxe
        uses: actions/download-artifact@v4
        with:
          name: linuxBinaries
          path: linuxBinaries

      - name: Setup Haxe
        run: |
          set -ex
          tar -xf linuxBinaries/*_bin.tar.gz -C linuxBinaries --strip-components=1
          sudo mkdir -p /usr/local/bin/
          sudo mkdir -p /usr/local/share/haxe/
          sudo ln -s `pwd`/linuxBinaries/haxe /usr/local/bin/haxe
          sudo ln -s `pwd`/linuxBinaries/haxelib /usr/local/bin/haxelib
          sudo ln -s `pwd`/linuxBinaries/std /usr/local/share/haxe/std

      - name: Download xmldoc artifact
        uses: actions/download-artifact@v4
        with:
          name: xmldoc
          path: xmldoc

      - name: Deploy to api.haxe.org
        env:
          GHP_EMAIL: haxe-ci@onthewings.net
          GHP_USERNAME: Haxe CI Bot
          GHP_REMOTE: ${{ secrets.GHP_REMOTE }}
        run: |
          set -ex
          LOCAL="`pwd`/extra/api.haxe.org"
          git clone "${GHP_REMOTE}" "${LOCAL}"
          haxe --cwd "${LOCAL}" --run ImportXml "`pwd`/xmldoc"
