name: Setup neko
runs:
  using: composite
  steps:
  - name: Install Neko from GitHub releases
    shell: pwsh
    if: runner.os == 'Windows'
    env:
      NEKO_TAG: v2-4-1
      NEKO_VERSION: 2.4.1
    run: |
      $NekoAsset = "neko-$env:NEKO_VERSION-win64.zip"
      Invoke-WebRequest "https://github.com/ShadowEngineTeam/neko/releases/download/$env:NEKO_TAG/$NekoAsset" -OutFile $env:RUNNER_TEMP/neko.zip
      Expand-Archive $env:RUNNER_TEMP/neko.zip -DestinationPath $env:RUNNER_TEMP
      $NEKOPATH = Get-ChildItem $env:RUNNER_TEMP/neko-*-*
      echo "$NEKOPATH" >> $env:GITHUB_PATH
      echo "NEKOPATH=$NEKOPATH" >> $env:GITHUB_ENV

  - name: Install Neko from GitHub releases
    shell: bash
    if: runner.os != 'Windows'
    env:
      NEKO_TAG: v2-4-1
      NEKO_VERSION: 2.4.1
    run: |
      set -ex

      case "$PLATFORM" in
        linux64)      NEKO_ASSET=linux64 ;;
        linux-arm64)  NEKO_ASSET=linux-arm64 ;;
        mac|osx64)    NEKO_ASSET=osx64 ;;
        mac-arm64|osx-arm64)  NEKO_ASSET=osx-arm64 ;;
        *) echo "Unknown PLATFORM: $PLATFORM" >&2; exit 1 ;;
      esac

      NEKO_FILE="neko-$NEKO_VERSION-$NEKO_ASSET.tar.gz"

      curl -sSL --retry 3 --retry-delay 5 --fail \
        "https://github.com/ShadowEngineTeam/neko/releases/download/$NEKO_TAG/$NEKO_FILE" \
        -o $RUNNER_TEMP/neko.tar.gz
      tar -xf $RUNNER_TEMP/neko.tar.gz -C $RUNNER_TEMP
      NEKOPATH=`echo $RUNNER_TEMP/neko-*-*`
      sudo mkdir -p /usr/local/bin
      sudo mkdir -p /usr/local/include
      sudo mkdir -p /usr/local/lib/neko
      sudo ln -s $NEKOPATH/{neko,nekoc,nekoml,nekotools}  /usr/local/bin/
      sudo ln -s $NEKOPATH/libneko.*                      /usr/local/lib/
      sudo ln -s $NEKOPATH/include/*                      /usr/local/include/
      sudo ln -s $NEKOPATH/*.ndll                         /usr/local/lib/neko/
      echo "NEKOPATH=$NEKOPATH" >> $GITHUB_ENV

  - name: Print Neko version
    shell: bash
    run: neko -version 2>&1
