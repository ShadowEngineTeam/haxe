# DO NOT EDIT. Generated from /extra/github-actions
# TODO: support skip ci (https://github.community/t/github-actions-does-not-respect-skip-ci/17325/8)

name: CI
on: workflow_dispatch

env:
  OCAML_VERSION: 4.14.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows64-build:
    # Built under MSYS2 (UCRT64) to unify the Windows jobs on MSYS2.
    # OCaml and the C dependencies come from MSYS2 packages; opam (which
    # MSYS2 does not package) is fetched from its official Windows release
    # and used only to install the OCaml libraries against the system
    # (MSYS2) OCaml. EXPERIMENTAL: replaces the previous Cygwin/setup-ocaml
    # recipe and needs CI verification. Installer/choco packaging is skipped
    # for now because Makefile.win's packaging relies on Cygwin's cygcheck.
    runs-on: windows-latest
    env:
      PLATFORM: windows64
      ARCH: 64
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make patch diffutils tar curl unzip rsync m4 perl
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ocaml
            mingw-w64-ucrt-x86_64-pcre
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-mbedtls
            mingw-w64-ucrt-x86_64-zlib

      - name: Install Neko (win64)
        shell: msys2 {0}
        run: |
          set -ex
          curl -sSL https://github.com/ShadowEngineTeam/neko/releases/download/v2-4-1/neko-2.4.1-win64.zip -o /tmp/neko.zip
          mkdir -p /tmp/neko && unzip -q /tmp/neko.zip -d /tmp/neko
          NEKOPATH=$(echo /tmp/neko/neko-*-*)
          echo "NEKOPATH=$NEKOPATH" >> $GITHUB_ENV
          "$NEKOPATH/neko" -version 2>&1 || true

      - name: Install opam (official Windows binary)
        shell: msys2 {0}
        run: |
          set -ex
          curl -fsSL -o /usr/bin/opam.exe \
            https://github.com/ocaml/opam/releases/download/2.3.0/opam-2.3.0-x86_64-windows.exe
          opam --version

      - name: Set ADD_REVISION=1 for non-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: msys2 {0}
        run: echo "ADD_REVISION=1" >> $GITHUB_ENV

      - name: Build Haxe
        shell: msys2 {0}
        run: |
          set -ex
          export PATH="$NEKOPATH:$PATH"
          # Apply to every opam call: depext prompts appear in switch create
          # and install too, and plain --yes does not answer them.
          export OPAMCONFIRMLEVEL=unsafe-yes
          export OPAMYES=1
          # MSYS2's GCC 15 defaults to C23, where an empty parameter list means
          # "no arguments"; OCaml 4.14 and the custom runtimes generated by
          # ocamlc (e.g. dune's bootstrap) rely on the old meaning. Put the
          # standard in CC so it is recorded in ocamlc's config and inherited
          # by every downstream C compile, not just OCaml's own build.
          export CC="gcc -std=gnu17"
          export CFLAGS="-std=gnu17 ${CFLAGS:-}"
          # conf-mbedtls compiles a probe with plain gcc, which does not look in
          # /ucrt64/include by default; CPATH makes mbedtls/version.h visible.
          export CPATH="/ucrt64/include${CPATH:+:$CPATH}"
          export LIBRARY_PATH="/ucrt64/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          # conf-perl-* probes need these Perl modules, which MSYS2 does not ship.
          curl -fsSL https://cpanmin.us -o /tmp/cpanm
          perl /tmp/cpanm --notest IPC::System::Simple String::ShellQuote
          git config --global --add safe.directory "$PWD"
          # Point opam at the MSYS2 already in PATH instead of letting it
          # download and manage its own internal Cygwin (opam's default).
          opam init --bare --disable-sandboxing --cygwin-location="$(cygpath -w /)"
          # Do NOT use ocaml-system: MSYS2 ships OCaml 5.4.1, which conflicts
          # with this repo's pinned deps (haxe.opam's 4.08-5.0 branch needs
          # ocamlfind 1.9.1, i.e. ocaml < 4.13). Build the OCaml version this
          # repo targets instead; the MSYS2 mingw toolchain compiles it.
          opam switch create . ocaml-base-compiler.${{ env.OCAML_VERSION }} --no-install
          eval $(opam env)
          # Pin the local package first: without this, opam resolves "haxe"
          # from the opam repository (the published 4.1.1) and installs ITS
          # dependency versions - e.g. extlib 1.7.7, while this tree needs
          # >= 1.7.8 for ExtString's labelled starts_with/ends_with.
          opam pin add haxe . --no-action --kind path
          opam install haxe --deps-only --assume-depexts
          opam list
          opam exec -- make -s -f Makefile.win -j"$(nproc)" STATICLINK=1 haxe
          opam exec -- make -s -f Makefile.win STATICLINK=1 haxelib
          ./haxe.exe -version
          # Statically linked: should list no mingw pcre2/zlib/mbedtls DLLs.
          ldd ./haxe.exe || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win${{env.ARCH}}Binaries
          path: |
            haxe.exe
            haxelib.exe
            std


  windows-build:
    runs-on: windows-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      PLATFORM: windows
      ARCH: 32
      MINGW_ARCH: i686
      CYG_ROOT: D:\cygwin
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Use GNU Tar from msys
        run: |
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rm C:\msys64\usr\bin\bash.exe

      - name: choco install nsis
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 10
          command: choco install --no-progress nsis.portable --version 3.09 -y

      - name: choco install things
        shell: pwsh
        run: choco install --no-progress curl wget 7zip.portable -y

      - name: Prepend Chocolatey path
        shell: pwsh
        run: Write-Host "::add-path::C:\ProgramData\chocolatey\bin"

      - name: Install Neko from GitHub releases
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/ShadowEngineTeam/neko/releases/download/v2-4-1/neko-2.4.1-win.zip -OutFile $env:RUNNER_TEMP/neko_latest.zip
          Expand-Archive $env:RUNNER_TEMP/neko_latest.zip -DestinationPath $env:RUNNER_TEMP
          $NEKOPATH = Get-ChildItem $env:RUNNER_TEMP/neko-*-*
          echo "$NEKOPATH" >> $env:GITHUB_PATH
          echo "NEKOPATH=$NEKOPATH" >> $env:GITHUB_ENV

      - name: Print Neko version
        run: neko -version 2>&1

      - name: Setup ocaml
        id: ocaml
        continue-on-error: true
        uses: kLabz/setup-ocaml@win32
        with:
          ocaml-compiler: 4.08.1
          opam-depext: false
          opam-repositories: |
            opam-repository-mingw: https://github.com/ocaml-opam/opam-repository-mingw.git#sunset
            default: https://github.com/ocaml/opam-repository.git
          opam-local-packages: |
            haxe.opam
          cache-prefix: w32-v1

      # TODO make it work on first try
      # (when cygwin cache doesn't exist, ocaml install fails with a curl error)
      - name: Setup ocaml (second chance)
        if: steps.ocaml.outcome == 'failure'
        uses: kLabz/setup-ocaml@win32
        with:
          ocaml-compiler: 4.08.1
          opam-depext: false
          opam-repositories: |
            opam-repository-mingw: https://github.com/ocaml-opam/opam-repository-mingw.git#sunset
            default: https://github.com/ocaml/opam-repository.git
          opam-local-packages: |
            haxe.opam
          cache-prefix: w32-v1

      - name: Install dependencies
        shell: pwsh
        env:
          MBEDTLS_VERSION: 2.16.3
        run: |
          Set-PSDebug -Trace 1
          curl.exe -fsSL -o "libmbedtls.tar.xz" --retry 3 `
            https://github.com/Simn/mingw64-mbedtls/releases/download/${{ env.MBEDTLS_VERSION }}/mingw64-${{ env.MINGW_ARCH }}-mbedtls-${{ env.MBEDTLS_VERSION }}-1.tar.xz
          & "$($env:CYG_ROOT)/bin/bash.exe" @('-lc', 'curl -L https://cpanmin.us | perl - App::cpanminus')
          & "$($env:CYG_ROOT)/bin/bash.exe" @('-lc', 'cpanm IPC::System::Simple')
          & "$($env:CYG_ROOT)/bin/bash.exe" @('-lc', 'cpanm String::ShellQuote')
          & "$($env:CYG_ROOT)/bin/bash.exe" @('-lc', 'cd "$OLDPWD" && tar -C / -xvf libmbedtls.tar.xz')

      - name: Install OCaml libraries
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 10
          retry_on: timeout
          shell: pwsh
          command: |
            Set-PSDebug -Trace 1
            # see: https://github.com/aantron/luv/issues/162
            $env:PATH="${env:CYG_ROOT}\bin;${env:CYG_ROOT}\usr\i686-w64-mingw32\bin;${env:PATH}"
            opam install haxe --deps-only
            opam list

      - name: Expose mingw dll files
        shell: pwsh
        run: Write-Host "::add-path::${env:CYG_ROOT}/usr/$($env:MINGW_ARCH)-w64-mingw32/sys-root/mingw/bin"

      # required to be able to retrieve the revision
      - name: Mark directory as safe
        shell: pwsh
        run: |
          Set-PSDebug -Trace 1
          & "$($env:CYG_ROOT)/bin/bash.exe" @('-lc', 'git config --global --add safe.directory "$OLDPWD"')

      - name: Set ADD_REVISION=1 for non-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: echo "ADD_REVISION=1" >> $Env:GITHUB_ENV

      - name: Build Haxe
        shell: pwsh
        run: |
          Set-PSDebug -Trace 1
          & "$($env:CYG_ROOT)/bin/bash.exe" @('-lc', 'cd "$OLDPWD" && opam config exec -- make -s -f Makefile.win -j`nproc` haxe 2>&1')
          & "$($env:CYG_ROOT)/bin/bash.exe" @('-lc', 'cd "$OLDPWD" && opam config exec -- make -s -f Makefile.win haxelib 2>&1')
          & "$($env:CYG_ROOT)/bin/bash.exe" @('-lc', 'cd "$OLDPWD" && opam config exec -- make -f Makefile.win echo_package_files package_bin package_installer_win package_choco 2>&1')
          & "$($env:CYG_ROOT)/bin/bash.exe" @('-lc', 'cd "$OLDPWD" && cygcheck ./haxe.exe')
          & "$($env:CYG_ROOT)/bin/bash.exe" @('-lc', 'cd "$OLDPWD" && cygcheck ./haxelib.exe')
          & "$($env:CYG_ROOT)/bin/bash.exe" @('-lc', 'cd "$OLDPWD" && ls ./out')

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win${{env.ARCH}}Binaries
          path: out


  windows-arm64-build:
    # EXPERIMENTAL SPIKE (expected to fail): try to build OCaml from source
    # for native aarch64-Windows using MSYS2 / CLANGARM64. Mainline OCaml has
    # no supported aarch64-Windows target and there is no usable fork, so no
    # OCaml compiler targets this platform yet. This job attempts a
    # bytecode-only build (bytecode needs no target codegen, so it has the
    # best odds) to find out how far a from-source build gets and where it
    # breaks. It is not part of the release artifacts until it yields a
    # working compiler; subsequent steps (opam, deps, Haxe) come after.
    runs-on: windows-11-arm
    env:
      PLATFORM: windows-arm64
      ARCH: arm64
      OCAML_SRC_VERSION: "5.3.0"
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Set up MSYS2 (CLANGARM64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git make patch diffutils tar curl
            mingw-w64-clang-aarch64-toolchain

      - name: Try to build OCaml from source (bytecode-first)
        shell: msys2 {0}
        run: |
          set -ex
          ver="$OCAML_SRC_VERSION"
          curl -LO "https://github.com/ocaml/ocaml/archive/refs/tags/${ver}.tar.gz"
          tar xf "${ver}.tar.gz"
          cd "ocaml-${ver}"
          # Mainline has no aarch64-Windows native backend, so attempt a
          # bytecode-only build (no target-specific codegen needed).
          ./configure --disable-native-compiler --prefix=/clangarm64 CC=clang
          make -j"$(nproc)"
          make install
          ocamlc -config
          ocamlc -version

      # TODO(next): if the bytecode OCaml builds, build opam from source, then
      # build Haxe's OCaml deps and Haxe itself (as bytecode) with the
      # CLANGARM64 C toolchain + the win-arm64 Neko.


  linux-build:
    runs-on: ubuntu-22.04
    env:
      PLATFORM: linux64
      OPAMYES: 1
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Cache opam
        id: cache-opam
        uses: actions/cache@v4
        with:
          path: ~/.opam/
          key: ${{ runner.os }}-${{ env.OCAML_VERSION }}-${{ hashFiles('./haxe.opam', './libs/') }}-1

      - name: Install Neko from GitHub releases
        run: |
          set -ex

          curl -sSL https://github.com/ShadowEngineTeam/neko/releases/download/v2-4-1/neko-2.4.1-linux64.tar.gz -o $RUNNER_TEMP/neko_latest.tar.gz
          tar -xf $RUNNER_TEMP/neko_latest.tar.gz -C $RUNNER_TEMP
          NEKOPATH=`echo $RUNNER_TEMP/neko-*-*`
          sudo mkdir -p /usr/local/bin
          sudo mkdir -p /usr/local/include
          sudo mkdir -p /usr/local/lib/neko
          sudo ln -s $NEKOPATH/{neko,nekoc,nekoml,nekotools}  /usr/local/bin/
          sudo ln -s $NEKOPATH/libneko.*                      /usr/local/lib/
          sudo ln -s $NEKOPATH/include/*                      /usr/local/include/
          sudo ln -s $NEKOPATH/*.ndll                         /usr/local/lib/neko/
          echo "NEKOPATH=$NEKOPATH" >> $GITHUB_ENV

      - name: Print Neko version
        run: neko -version 2>&1


      - name: Install dependencies
        run: |
          set -ex
          sudo apt-get update -qqy
          sudo apt-get install -qqy darcs bubblewrap ocaml-nox libpcre2-dev zlib1g-dev libgtk2.0-dev libmbedtls-dev ninja-build
          curl -sSL https://github.com/ocaml/opam/releases/download/2.3.0/opam-2.3.0-x86_64-linux -o $RUNNER_TEMP/opam
          sudo install $RUNNER_TEMP/opam /usr/local/bin/opam

      - name: Install OCaml libraries
        if: steps.cache-opam.outputs.cache-hit != 'true'
        run: |
          set -ex
          opam init -c ${{ env.OCAML_VERSION }}
          opam update
          opam pin add haxe . --no-action
          opam install haxe --deps-only --assume-depexts
          opam list
          ocamlopt -v

      - name: Set ADD_REVISION=1 for non-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "ADD_REVISION=1" >> $GITHUB_ENV

      - name: Build Haxe
        run: |
          set -ex
          eval $(opam env)
          opam config exec -- make -s -j`nproc` STATICLINK=1 haxe
          opam config exec -- make -s haxelib
          make -s package_unix
          ls -l out
          ldd -v ./haxe
          ldd -v ./haxelib

      # https://stackoverflow.com/questions/58033366/how-to-get-current-branch-within-github-actions
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Build xmldoc
        run: |
          set -ex
          make -s xmldoc
          cat >extra/doc/info.json <<EOL
            {
              "commit": "$GITHUB_SHA",
              "branch": "${{ steps.extract_branch.outputs.branch }}"
            }
          EOL

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBinaries
          path: out

      - name: Upload xmldoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmldoc
          path: extra/doc

  linux-arm64-build:
